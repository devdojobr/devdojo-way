name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      # Fixed command: no -D overrides, no --fail-never. Testcontainers uses the runner's Docker.
      - run: ./mvnw -B -ntp verify
